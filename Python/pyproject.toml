[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-zinc"
version = "1.0"
description = "Python 3 interface to the TkZinc widget"
readme = "README.md"
requires-python = ">=3.8"
authors = [{name = "Guillaume Vidon"}]
license = {text = "GPL"}
dependencies = ["Pillow>=7"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: User Interfaces",
]

[project.urls]
Repository = "https://github.com/asb-capfan/TkZinc"

[tool.setuptools]
packages = ["Zinc"]
package-dir = {Zinc = "library"}
include-package-data = false

[tool.setuptools.data-files]
"share/doc/zinc-python/demos/Graphics" = ["demos/testGraphics.py", "demos/paper.gif"]
